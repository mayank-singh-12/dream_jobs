<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .header { text-align: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: #1e3a8a; margin: 0; }
        .header p { font-size: 14px; color: #6b7280; margin: 5px 0 0 0; }
        .stats-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
        .stat-card { flex: 1; min-width: 150px; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #bbf7d0; }
        .stat-card.drives { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border-color: #bfdbfe; }
        .stat-card.applied { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-color: #fde68a; }
        .stat-number { font-size: 28px; font-weight: bold; color: #111827; margin: 10px 0 0 0; }
        .stat-label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #4b5563; }
        .footer { text-align: center; font-size: 12px; color: #9ca3af; border-top: 1px solid #e5e7eb; padding-top: 20px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Monthly Placement Activity Report</h1>
            <p>Report Period: {{ period_start }} to {{ period_end }}</p>
        </div>
        <div class="stats-grid">
            <div class="stat-card drives">
                <div class="stat-label">Drives Conducted</div>
                <div class="stat-number">{{ drives_count }}</div>
            </div>
            <div class="stat-card applied">
                <div class="stat-label">Students Applied</div>
                <div class="stat-number">{{ applied_count }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Students Selected</div>
                <div class="stat-number">{{ selected_count }}</div>
            </div>
        </div>
        <div class="footer">
            <p>This is an automated monthly report generated by the Placement Portal.</p>
        </div>
    </div>
</body>
</html>
